name: 🚀 Build + Deploy to Hostinger

on:
  push:
    branches: ["master"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: 🧱 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📥 Install dependencies
        run: npm install

      - name: 🛠️ Build static export
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.GOOGLE_ADS_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_WHATSAPP_LABEL: ${{ vars.GOOGLE_ADS_WHATSAPP_LABEL }}
          NEXT_PUBLIC_GOOGLE_ADS_CALL_LABEL: ${{ vars.GOOGLE_ADS_CALL_LABEL }}
        run: |
          npm run build
          echo "build-$(date -u +%Y%m%d-%H%M%S)" > out/build.txt
          test -f out/index.html

      - name: 🚚 FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          local-dir: out/
          server-dir: ./
          dangerous-clean-slate: true